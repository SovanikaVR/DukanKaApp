<!doctype html>
<html lang="hi"><head><meta charset="utf-8">
<style>
  html, body { margin: 0; width: 480px; height: 960px; overflow: hidden; background: linear-gradient(180deg, #1F3A5F 0%, #142842 100%); font-family: 'Noto Sans Devanagari', 'IBM Plex Sans', system-ui, sans-serif; }
  .title { position: absolute; left: 0; right: 0; top: 10px; text-align: center; color: #F3E3B8; font-weight: 700; font-size: 17px; letter-spacing: .02em; }
  .phone { position: absolute; left: 39px; top: 40px; width: 402px; height: 668px; border-radius: 26px; background: #0B1626; padding: 6px; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
  iframe { width: 390px; height: 656px; border: 0; border-radius: 20px; background: #fff; display: block; }
  .talk { position: absolute; left: 12px; right: 12px; bottom: 14px; height: 232px; display: flex; align-items: flex-end; gap: 6px; }
  .munim { width: 132px; height: 200px; flex: none; }
  .bubble { flex: 1; align-self: stretch; background: #FFFDF6; border: 3px solid #C9962B; border-radius: 20px; padding: 14px 16px; position: relative;
    display: flex; align-items: center; font-size: 21px; line-height: 1.45; color: #15202B; font-weight: 600; }
  .bubble:before { content: ''; position: absolute; left: -16px; bottom: 46px; border: 10px solid transparent; border-right: 14px solid #C9962B; }
  .bubble .name { position: absolute; top: -13px; left: 14px; background: #C9962B; color: #fff; font-size: 13px; padding: 2px 10px; border-radius: 10px; }
  .tap { position: absolute; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: rgba(201,150,43,.45); border: 3px solid #C9962B; pointer-events: none; z-index: 9; animation: tap .7s ease-out forwards; }
  @keyframes tap { from { transform: scale(.4); opacity: 1; } to { transform: scale(1.4); opacity: 0; } }
  .mouth { transform-origin: 66px 100px; }
  .talking .mouth { animation: talk .28s infinite alternate; }
  @keyframes talk { from { transform: scaleY(.35); } to { transform: scaleY(1.15); } }
  .end { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 14px; color: #fff; text-align: center; background: rgba(20,40,66,.96); z-index: 20; }
  .end b { font-size: 30px; color: #F3E3B8; } .end span { font-size: 19px; }
</style></head>
<body>
  <div class="title" id="title"></div>
  <div class="phone"><iframe id="app" src="about:blank"></iframe></div>
  <div class="talk">
    <!-- "Munim ji": an original cartoon guide drawn for this app -->
    <svg class="munim" viewBox="0 0 132 200" aria-hidden="true">
      <ellipse cx="66" cy="196" rx="52" ry="5" fill="rgba(0,0,0,.25)"/>
      <path d="M14 196c0-44 22-66 52-66s52 22 52 66z" fill="#F4F1EA"/>
      <path d="M44 132l22 30 22-30" fill="none" stroke="#C9962B" stroke-width="4"/>
      <circle cx="66" cy="172" r="3" fill="#C9962B"/><circle cx="66" cy="184" r="3" fill="#C9962B"/>
      <rect x="54" y="112" width="24" height="22" fill="#E2B48A"/>
      <ellipse cx="66" cy="80" rx="38" ry="42" fill="#EBC199"/>
      <ellipse cx="27" cy="84" rx="7" ry="10" fill="#E2B48A"/><ellipse cx="105" cy="84" rx="7" ry="10" fill="#E2B48A"/>
      <path d="M26 58c0-26 18-36 40-36s40 10 40 36c-8-8-22-12-40-12s-32 4-40 12z" fill="#1F3A5F"/>
      <path d="M30 50c10-7 22-10 36-10s26 3 36 10" fill="none" stroke="#C9962B" stroke-width="3"/>
      <circle cx="51" cy="78" r="11" fill="#fff" stroke="#3a2a1a" stroke-width="3"/><circle cx="81" cy="78" r="11" fill="#fff" stroke="#3a2a1a" stroke-width="3"/>
      <path d="M62 78h8" stroke="#3a2a1a" stroke-width="3"/>
      <circle cx="52" cy="79" r="4" fill="#2b1d10"/><circle cx="80" cy="79" r="4" fill="#2b1d10"/>
      <path d="M44 62q7-5 14 0M74 62q7-5 14 0" fill="none" stroke="#6b4a2a" stroke-width="3" stroke-linecap="round"/>
      <path d="M66 82q-4 8 0 10" fill="none" stroke="#c9946a" stroke-width="3" stroke-linecap="round"/>
      <path d="M46 98q10-8 20-2q10-6 20 2q-10 4-20 0q-10 4-20 0z" fill="#4a3220"/>
      <ellipse class="mouth" cx="66" cy="104" rx="8" ry="5" fill="#8a3b2a"/>
    </svg>
    <div class="bubble"><span class="name">मुनीम जी</span><span id="say"></span></div>
  </div>
  <div class="end" id="end"><b>DukanKaApp</b><span id="endtext"></span></div>
</body></html>
